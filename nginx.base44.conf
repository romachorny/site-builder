server {
    listen 3000;
    server_name _;
    root /app;
    index builder.html;

    # The whole repository is the web root here, so the files that describe the
    # environment are downloadable unless they are closed by hand. Nothing in this
    # repo is secret, but the builder has no reason to hand out its own plumbing.
    location ~ ^/(\.base44|\.git)/ { return 404; }
    location ~ ^/(AGENTS\.md|README\.md|docker-compose\.base44\.yml|nginx\.base44.*\.conf|\.gitignore)$ { return 404; }

    # builder.html and the engine change together; ask before reusing either.
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # A missing file is a missing file. This used to fall back to builder.html, so
    # /media/tpl/fade.jpg and /favicon.svg answered 200 with the whole builder page
    # in the body — a broken image reads as a working one, which is worse than a 404.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
